version: '1.0'

services:
  postgres_db:
    image: postgres
    container_name: fatsapi_postgres_model
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
     - "${POSTGRES_PORT}:5432"
volumes:
     - postgres_data:/var/lib/postgresql/data

